<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Controle de Portaria{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    {% if usuario %}
    <nav class="sidebar bg-dark text-white p-3 d-flex flex-column">
      <h5 class="mb-4">Portaria</h5>
      <ul class="nav flex-column mb-auto">
        <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('main.inicio') }}">Início</a></li>
        {% if pode('gerenciar_usuarios') %}
        <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('usuarios.listar') }}">Usuários</a></li>
        {% endif %}
      </ul>
      <div class="border-top pt-3 small">
        <div class="fw-semibold">{{ usuario.login }}</div>
        <div class="text-white-50 mb-2">{{ usuario.perfil|nome_perfil }}</div>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-outline-light btn-sm w-100">Sair</button>
        </form>
      </div>
    </nav>
    {% endif %}
    <main class="flex-grow-1 p-4">
      {% include "_mensagens.html" %}
      {% block conteudo %}{% endblock %}
    </main>
  </div>
</body>
</html>

{% extends "base.html" %}
{% block titulo %}Entrar — Controle de Portaria{% endblock %}
{% block conteudo %}
<div class="login-caixa mx-auto mt-5">
  <h1 class="h4 text-center mb-4">Sistema de Controle de Portaria</h1>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="login" class="form-label">Login</label>
          <input type="text" class="form-control" id="login" name="login" value="{{ login }}" autofocus required>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

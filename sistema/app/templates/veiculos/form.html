{% extends "base.html" %}
{% block titulo %}{{ titulo }} — Controle de Portaria{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card shadow-sm form-caixa">
  <div class="card-body p-4">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="placa" class="form-label">Placa</label>
        <input type="text" class="form-control text-uppercase" id="placa" name="placa" value="{{ valores.placa }}"
               maxlength="8" placeholder="ABC-1234 ou ABC1D23" required>
        <div class="form-text">Cada placa só pode ser cadastrada uma vez.</div>
      </div>
      <div class="mb-3">
        <label for="modelo" class="form-label">Modelo</label>
        <input type="text" class="form-control" id="modelo" name="modelo" value="{{ valores.modelo }}" required>
      </div>
      <div class="mb-3">
        <label for="cor" class="form-label">Cor</label>
        <input type="text" class="form-control" id="cor" name="cor" value="{{ valores.cor }}" required>
      </div>
      <div class="mb-4">
        <label for="pessoa_id" class="form-label">Proprietário</label>
        <select class="form-select" id="pessoa_id" name="pessoa_id" required>
          <option value="">Selecione...</option>
          {% for p in proprietarios %}
          <option value="{{ p.id }}" {{ 'selected' if valores.pessoa_id == p.id|string else '' }}>{{ p.nome }} — CPF {{ p.cpf|formatar_cpf }}</option>
          {% endfor %}
        </select>
        {% if not proprietarios %}
        <div class="form-text text-danger">Cadastre uma pessoa antes de cadastrar o veículo.</div>
        {% endif %}
      </div>
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('veiculos.listar') }}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}

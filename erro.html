{% extends "base.html" %}
{% block titulo %}Erro {{ codigo }} — Controle de Portaria{% endblock %}
{% block conteudo %}
<div class="text-center mt-5 mx-auto" style="max-width: 520px;">
  <div class="display-4 fw-semibold text-secondary">{{ codigo }}</div>
  <p class="lead mt-2">{{ mensagem }}</p>
  <div class="d-flex justify-content-center gap-2">
    <a class="btn btn-primary" href="{{ url_for('main.inicio') }}">Voltar ao início</a>
    <a class="btn btn-outline-secondary" href="javascript:history.back()">Voltar à página anterior</a>
  </div>
</div>
{% endblock %}
